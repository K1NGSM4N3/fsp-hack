auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Sized for mem_limit 256m (GOMEMLIMIT in compose.yml). The WAL replay after a crash was capped
# only by the default 4 GB ceiling, so a restart that replayed a large WAL ran out of memory and
# crashed again; now replay flushes to storage past 64 MB, and chunks are cut and flushed sooner.
ingester:
  wal:
    replay_memory_ceiling: 64MB
  chunk_idle_period: 15m
  max_chunk_age: 1h

querier:
  max_concurrent: 2

limits_config:
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_parallelism: 2
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
