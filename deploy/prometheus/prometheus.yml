global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
  - job_name: embedder
    metrics_path: /metrics
    static_configs:
      - targets: ["embedder:8093"]
        labels:
          service: embedder
