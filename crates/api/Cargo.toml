[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
catalog = { workspace = true, features = ["openapi"] }
matching = { workspace = true, features = ["openapi"] }
db = { workspace = true, features = ["deadpool"] }

thiserror.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rand.workspace = true
rand_chacha.workspace = true
axum.workspace = true
axum-extra = { version = "0.12", features = ["cookie"] }
utoipa = { workspace = true, features = ["chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "limit", "timeout", "catch-panic", "sensitive-headers"] }

chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
refinery = { version = "0.10", default-features = false, features = ["tokio-postgres"] }

argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
subtle = "2"

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
krilla = "0.8"
pdf-extract = "0.12"
