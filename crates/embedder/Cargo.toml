[package]
name = "embedder"
version = "0.1.0"
description = "Local sentence embeddings: the model (candle) and its HTTP service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["server"]
# Inference: candle (pure Rust) and the Hugging Face tokenizer without its C/C++ parts.
model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rustc-hash"]
server = ["model", "dep:axum", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:metrics", "dep:metrics-exporter-prometheus"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
rustc-hash = { version = "2", optional = true }

axum = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }

[[bin]]
name = "embedder"
required-features = ["server"]
