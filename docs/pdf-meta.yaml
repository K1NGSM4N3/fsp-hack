# Raw typst: a plain string here is read as Markdown and escaped into a stray first page.
# The body font is set here rather than via `mainfont`, which takes a single family: PT Sans
# has no Greek, arrows or superscript digits: θ, →, ⁻⁷ come from New Computer Modern and
# Libertinus Serif, both embedded in typst. PT Sans itself must be installed: without it the
# body silently falls back to New Computer Modern.
header-includes: |
  ```{=typst}
  #set text(font: ("PT Sans", "New Computer Modern", "Libertinus Serif"))
  #show table.cell: set par(justify: false)
  #show table.cell: set text(size: 9pt, hyphenate: false)
  ```
