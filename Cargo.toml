[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/matching",
    "crates/db", # generated by clorinde (make gen-db)
    "crates/api",
    "crates/fsp-mock",
    "crates/validate",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
catalog = { path = "crates/catalog" }
matching = { path = "crates/matching" }
db = { path = "crates/db", default-features = false }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "time", "preserve_order"] }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
